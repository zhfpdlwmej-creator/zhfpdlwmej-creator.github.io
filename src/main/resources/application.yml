server:
  port: 8180
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # 정적 텍스트 전송 압축 (사용자 데이터가 아닌 페이지 자원만 해당)
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,image/svg+xml

## log
logging:
  level:
    root: info
  pattern:
    console: '%d{yy.MM.dd HH:mm:ss} [%thread] %-5level %logger{0} - %msg%n'

spring:
  profiles:
    group:
      local: "local"
      real: "real"
    default: local

  freemarker:
    template-loader-path: classpath:/templates
    contentType: text/html
    charset: UTF-8
    suffix: .html
    cache: false

  web:
    resources:
      cache:
        cachecontrol:
          # /assets/** 는 ?v=버전 쿼리로 캐시 무효화 — 7일 캐시
          max-age: 7d
          cache-public: true

# 사용자정의 프로퍼티
promptslim:
  version: ${PROMPTSLIM_VERSION:1.0.1}
  security:
    # ------------------------------------------------------------
    # Zero Server Side Request 보증의 핵심 — connect-src 'none'
    #  · 페이지 JS 는 fetch/XHR/WebSocket/sendBeacon 을 어디로도 보낼 수 없다 (브라우저가 차단)
    #  · form-action 'none' : 폼 전송 불가
    #  · CDN 은 스크립트/스타일/폰트 "다운로드"만 허용 (데이터 업로드 경로 없음)
    #  · 애드센스 실연동 시: script-src/frame-src/img-src 에 Google 광고 도메인 추가 필요 (README 참고)
    # ------------------------------------------------------------
    csp: >-
      default-src 'self';
      script-src 'self' https://cdn.tailwindcss.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
      font-src 'self' https://cdn.jsdelivr.net data:;
      img-src 'self' data:;
      worker-src 'self';
      connect-src 'none';
      form-action 'none';
      frame-ancestors 'none';
      base-uri 'none';
      object-src 'none'
